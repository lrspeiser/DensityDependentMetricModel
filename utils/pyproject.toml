[project]
name = "density-metric-utils"
version = "0.1.0"
description = "Utilities for density-dependent metric models (SPARC IO, analysis helpers)."
# PEP 621 author format: array of tables
authors = [{name = "DensityDependentMetricModel Authors", email = "noreply@example.com"}]
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "scipy>=1.9",
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "emcee>=3.1.0",
    "corner>=2.2.0",
    "numba>=0.57",
    "tqdm>=4.64",
    "pyarrow>=10.0.0"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

